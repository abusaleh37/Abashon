<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
  <head>
    <script>
    // যদি সেশন না থাকে, লগইন পেজে পাঠিয়ে দেবে
    if (!localStorage.getItem('sb-flwlpvavlsomhuoywvz-auth-token')) {
        window.location.href = 'employee-login.html';
    }
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login | ABASHON Consultancy & Construction</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: { 950: "#16181b", 900: "#1a1c1e", 850: "#222528" },
              gold: { DEFAULT: "#c5a059", light: "#d4b06a", dark: "#a8843f" },
            },
          },
        },
      };
    </script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-950 px-4 font-sans text-white antialiased">
    <div class="w-full max-w-md">
      <div class="rounded-lg border border-white/10 bg-slate-900 p-8 shadow-card">
        <h1 class="text-2xl font-semibold text-white">Employee Login</h1>
        <form id="login-form" class="mt-6 space-y-4">
          <input id="email" type="email" placeholder="ইমেইল" class="w-full rounded-md border border-white/15 bg-slate-950 px-3.5 py-2.5 text-sm text-white" required />
          <input id="password" type="password" placeholder="পাসওয়ার্ড" class="w-full rounded-md border border-white/15 bg-slate-950 px-3.5 py-2.5 text-sm text-white" required />
          <p id="login-error" class="hidden text-xs text-red-400"></p>
          <button id="login-submit" type="submit" class="w-full rounded-md bg-gold px-5 py-2.5 text-sm font-semibold text-slate-950 hover:bg-gold-light">প্রবেশ করুন</button>
        </form>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://flwlpvavvlsomhuoywvz.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_FZN4P-Pof8H3txLTOVb2oA_DSsTTMAo";

      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("login-error");

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          errorEl.textContent = "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।";
          errorEl.classList.remove("hidden");
        } else {
          window.location.href = "employee-dashboard.html";
        }
      });
    </script>
  </body>
</html>
