<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login | ABASHON Consultancy & Construction</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: { 950: "#16181b", 900: "#1a1c1e", 850: "#222528" },
              gold: { DEFAULT: "#c5a059", light: "#d4b06a", dark: "#a8843f" },
            },
          },
        },
      };
    </script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-950 px-4 font-sans text-white antialiased">
    <div class="w-full max-w-md">
      <div class="rounded-lg border border-white/10 bg-slate-900 p-8 shadow-card">
        <h1 class="text-2xl font-semibold text-white">Employee Login</h1>
        <form id="login-form" class="mt-6 space-y-4">
          <input id="email" type="email" placeholder="ইমেইল" class="w-full rounded-md border border-white/15 bg-slate-950 px-3.5 py-2.5 text-sm text-white" required />
          <input id="password" type="password" placeholder="পাসওয়ার্ড" class="w-full rounded-md border border-white/15 bg-slate-950 px-3.5 py-2.5 text-sm text-white" required />
          <p id="login-error" class="hidden text-xs text-red-400"></p>
          <button id="login-submit" type="submit" class="w-full rounded-md bg-gold px-5 py-2.5 text-sm font-semibold text-slate-950 hover:bg-gold-light">প্রবেশ করুন</button>
        </form>
      </div>
    </div>

    <script>
      // Supabase Client ইনিশিয়ালাইজ করা
const supabase = supabase.createClient('https://your-project-id.supabase.co', 'sb_publishable_FZN4P-Pof8H3txLTOVb2oA_DSsTTMAo');

// লগইন বাটনের ইভেন্ট হ্যান্ডলার... (বাকি অংশ ঠিক আছে)
      const supabase = supabase.createClient('আপনার_PROJECT_URL_এখানে_দিন', 'sb_publishable_FZN4P-Pof8H3txLTOVb2oA_DSsTTMAo');

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
          const errEl = document.getElementById('login-error');
          errEl.textContent = "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।";
          errEl.classList.remove('hidden');
        } else {
          window.location.href = "dashboard.html";
        }
      });
    </script>
  </body>
</html>
