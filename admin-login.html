<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | ABASHON Consultancy & Construction</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS v2 (single import only) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      background: radial-gradient(circle at top, #111827 0%, #020617 45%, #000000 100%);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.85), rgba(3, 7, 18, 0.9));
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
    }
    .input-dark {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }
    .input-dark:focus {
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

  <main class="w-full max-w-md">
    <section class="glass-card rounded-2xl p-7 sm:p-8">
      <!-- Header -->
      <div class="text-center mb-7">
        <img
          src="logo.png"
          alt="ABASHON Consultancy & Construction Logo"
          class="w-16 h-16 mx-auto mb-4 rounded-full object-cover ring-2 ring-sky-400/50"
        />
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Admin Login</h1>
        <p class="mt-2 text-sm text-slate-400">
          ABASHON Consultancy & Construction
        </p>
      </div>

      <!-- Form -->
      <form id="adminLoginForm" class="space-y-5" novalidate>
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="admin@abashon.com"
            autocomplete="email"
            required
            class="input-dark w-full rounded-xl px-4 py-3 text-sm placeholder:text-slate-500 transition"
          />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              minlength="6"
              class="input-dark w-full rounded-xl px-4 py-3 pr-28 text-sm placeholder:text-slate-500 transition"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-semibold text-sky-300 hover:text-sky-200 px-3 py-2 rounded-lg hover:bg-slate-800/60 transition"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="flex items-center justify-between">
          <label class="inline-flex items-center gap-2 text-sm text-slate-300 cursor-pointer select-none">
            <input
              id="rememberMe"
              type="checkbox"
              class="rounded border-slate-500 bg-slate-800 text-sky-500 focus:ring-sky-500"
            />
            Remember Me
          </label>
        </div>

        <!-- Status message -->
        <p id="statusMessage" class="hidden text-sm rounded-lg px-3 py-2"></p>

        <!-- Login button -->
        <button
          id="loginBtn"
          type="submit"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-sky-500 to-cyan-500 hover:from-sky-400 hover:to-cyan-400 text-slate-950 font-semibold py-3 transition disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <svg id="loadingSpinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"></circle>
            <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="3" class="opacity-90"></path>
          </svg>
          <span id="loginBtnText">Login</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    "use strict";

    // IMPORTANT: Paste your real Supabase credentials below.
    const SUPABASE_URL = "https://flwlpvavvlsomhuoywvz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FZN4P-Pof8H3txLTOVb2oA_DSsTTMAo";

    // Single Supabase client initialization only
    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const ui = {
      form: document.getElementById("adminLoginForm"),
      emailInput: document.getElementById("email"),
      passwordInput: document.getElementById("password"),
      rememberMeInput: document.getElementById("rememberMe"),
      togglePasswordBtn: document.getElementById("togglePasswordBtn"),
      statusMessage: document.getElementById("statusMessage"),
      loginBtn: document.getElementById("loginBtn"),
      loginBtnText: document.getElementById("loginBtnText"),
      loadingSpinner: document.getElementById("loadingSpinner")
    };

    function setLoading(isLoading) {
      try {
        ui.loginBtn.disabled = isLoading;
        ui.loadingSpinner.classList.toggle("hidden", !isLoading);
        ui.loginBtnText.textContent = isLoading ? "Signing in..." : "Login";
      } catch (error) {
        console.error("setLoading error:", error);
      }
    }

    function clearMessage() {
      try {
        ui.statusMessage.textContent = "";
        ui.statusMessage.className = "hidden text-sm rounded-lg px-3 py-2";
      } catch (error) {
        console.error("clearMessage error:", error);
      }
    }

    function showMessage(message, type = "error") {
      try {
        const baseClass = "text-sm rounded-lg px-3 py-2";
        const typeClass =
          type === "success"
            ? "text-emerald-300 bg-emerald-950/40 border border-emerald-900/60"
            : "text-red-400 bg-red-950/40 border border-red-900/60";

        ui.statusMessage.className = `${baseClass} ${typeClass}`;
        ui.statusMessage.textContent = message;
      } catch (error) {
        console.error("showMessage error:", error);
      }
    }

    function loadRememberedEmail() {
      try {
        const rememberedEmail = localStorage.getItem("adminRememberedEmail");
        if (rememberedEmail) {
          ui.emailInput.value = rememberedEmail;
          ui.rememberMeInput.checked = true;
        }
      } catch (error) {
        console.error("loadRememberedEmail error:", error);
      }
    }

    function updateRememberMe(email) {
      try {
        if (ui.rememberMeInput.checked) {
          localStorage.setItem("adminRememberedEmail", email);
        } else {
          localStorage.removeItem("adminRememberedEmail");
        }
      } catch (error) {
        console.error("updateRememberMe error:", error);
      }
    }

    function mapAuthError(error) {
      try {
        const msg = (error?.message || "").toLowerCase();

        if (msg.includes("invalid login credentials") || msg.includes("invalid password")) {
          return "Invalid password. Please try again.";
        }
        if (msg.includes("user not found") || msg.includes("invalid email")) {
          return "User not found. Please check your email.";
        }
        if (msg.includes("network") || msg.includes("failed to fetch") || msg.includes("fetch")) {
          return "Network error. Please check your internet connection and try again.";
        }
        if (msg.includes("access denied")) {
          return "Access Denied";
        }
        if (msg.includes("email not confirmed")) {
          return "Email not confirmed. Please verify your email before login.";
        }

        return error?.message || "Login failed. Please try again.";
      } catch (mapError) {
        console.error("mapAuthError error:", mapError);
        return "Login failed. Please try again.";
      }
    }

    function handlePasswordToggle() {
      try {
        const showing = ui.passwordInput.type === "text";
        ui.passwordInput.type = showing ? "password" : "text";
        ui.togglePasswordBtn.textContent = showing ? "Show" : "Hide";
        ui.togglePasswordBtn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      } catch (error) {
        console.error("handlePasswordToggle error:", error);
      }
    }

    async function verifyAdminRoleByEmployeesTable(authUserId) {
      try {
        // Uses required table and column names exactly as requested.
        const { data, error } = await supabase
          .from("Employees")
          .select("role")
          .eq("auth_user_id", authUserId)
          .maybeSingle();

        if (error) {
          console.error("employees role query error:", error);
          throw new Error("Unable to verify admin access right now. Please try again.");
        }

        if (!data) return false;

        const role = String(data.role || "").trim().toLowerCase();
        return role === "admin";
      } catch (error) {
        console.error("verifyAdminRoleByEmployeesTable error:", error);
        throw error;
      }
    }

    async function signOutSafely() {
      try {
        const { error } = await supabase.auth.signOut();
        if (error) {
          console.error("signOut error:", error);
        }
      } catch (error) {
        console.error("signOutSafely exception:", error);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      clearMessage();

      const email = ui.emailInput.value.trim();
      const password = ui.passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter both email and password.");
        return;
      }

      setLoading(true);

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          console.error("signInWithPassword error:", error);
          showMessage(mapAuthError(error));
          return;
        }

        const authenticatedUser = data?.user;
        if (!authenticatedUser?.id) {
          console.error("Authenticated user missing after login:", data);
          showMessage("User not found. Please check your email.");
          return;
        }

        const isAdmin = await verifyAdminRoleByEmployeesTable(authenticatedUser.id);

        if (!isAdmin) {
          await signOutSafely();
          showMessage("Access Denied");
          return;
        }

        updateRememberMe(email);
        window.location.href = "admin-dashboard.html";
      } catch (error) {
        console.error("handleLogin error:", error);
        showMessage(mapAuthError(error));
      } finally {
        setLoading(false);
      }
    }

    async function checkExistingSession() {
      try {
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          console.error("getSession error:", error);
          return;
        }

        const sessionUser = data?.session?.user;
        if (!sessionUser?.id) return;

        const isAdmin = await verifyAdminRoleByEmployeesTable(sessionUser.id);

        if (isAdmin) {
          window.location.href = "admin-dashboard.html";
          return;
        }

        await signOutSafely();
      } catch (error) {
        console.error("checkExistingSession error:", error);
      }
    }

    function init() {
      try {
        loadRememberedEmail();
        ui.togglePasswordBtn.addEventListener("click", handlePasswordToggle);
        ui.form.addEventListener("submit", handleLogin);

        checkExistingSession().catch((error) => {
          console.error("checkExistingSession promise error:", error);
        });
      } catch (error) {
        console.error("init error:", error);
        showMessage("Something went wrong. Please refresh the page.");
      }
    }

    init();
  </script>
</body>
</html>
