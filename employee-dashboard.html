<!-- Navbar -->
<header class="glass flex items-center justify-between px-6 py-4">
  <button id="toggleSidebar" class="md:hidden px-3 py-1 glass rounded">☰</button>

  <div>
    <h2 class="text-lg font-semibold">ABASHON Consultancy & Construction</h2>
    <p id="currentDate" class="text-sm text-gray-400"></p>
  </div>

  <div class="flex items-center gap-4">
    <a href="employee-profile.html" class="text-sm underline hover:text-white">Profile</a>
    <span id="employeeName" class="text-sm"></span>
    <img id="profilePic" class="w-10 h-10 rounded-full border border-white/20" src="https://i.pravatar.cc/100" />
  </div>
</header>

<!-- Content -->
<main class="p-6 overflow-y-auto">

  <!-- Welcome -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold">Welcome back, <span id="welcomeName">User</span></h1>
    <p class="text-gray-400">Here is your dashboard overview</p>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

    <div class="glass p-4 rounded-xl glass-hover">
      <p>Total Tasks</p>
      <h2 id="totalTasks" class="text-2xl font-bold">0</h2>
    </div>

    <div class="glass p-4 rounded-xl glass-hover">
      <p>Completed</p>
      <h2 id="completedTasks" class="text-2xl font-bold">0</h2>
    </div>

    <div class="glass p-4 rounded-xl glass-hover">
      <p>Pending</p>
      <h2 id="pendingTasks" class="text-2xl font-bold">0</h2>
    </div>

    <div class="glass p-4 rounded-xl glass-hover">
      <p>Attendance</p>
      <h2 id="attendanceStatus" class="text-2xl font-bold">--</h2>
    </div>

  </div>

  <!-- Employee Info -->
  <div class="glass p-6 rounded-xl">
    <h2 class="text-xl font-semibold mb-4">Employee Information</h2>

    <div class="grid md:grid-cols-2 gap-4 text-sm">
      <p><span class="text-gray-400">Full Name:</span> <span id="fullName"></span></p>
      <p><span class="text-gray-400">Email:</span> <span id="email"></span></p>
      <p><span class="text-gray-400">Designation:</span> <span id="designation"></span></p>
      <p><span class="text-gray-400">Department:</span> <span id="department"></span></p>
    </div>
  </div>

</main>
